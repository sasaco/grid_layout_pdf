[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gridlayoutpdf"
version = "0.1.0"
description = "Grid-aligned PDF calculation reports built from Python components."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reportlab>=5.0.1",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gridlayoutpdf"]
# The bundled IPAex fonts, their license and manifest are package data (FR-024).
artifacts = ["src/gridlayoutpdf/font_data/*"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md"]
artifacts = ["src/gridlayoutpdf/font_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
# Keep test tools installed for the shared runner's plain `uv run pytest`.
dev = [
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
